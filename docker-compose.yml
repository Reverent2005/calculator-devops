services:
  calculator-api:
    image: ${CALCULATOR_IMAGE:-calculator-api:local}
    build:
      context: .
    environment:
      SERVER_PORT: 8080
      APP_VERSION: ${APP_VERSION:-local}
    expose:
      - "8080"
    networks:
      - calculator-network
    restart: unless-stopped
    healthcheck:
      # Bash TCP check avoids adding curl/wget to the minimal runtime image.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080; printf \"GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"UP\" <&3'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: calculator-nginx:local
    build:
      context: ./nginx
    depends_on:
      calculator-api:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    networks:
      - calculator-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  calculator-network:
    name: calculator-network
    driver: bridge
